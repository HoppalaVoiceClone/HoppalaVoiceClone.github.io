name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare authenticated site
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          case "$HF_TOKEN" in hf_*) ;; *) exit 1 ;; esac
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/
          cp -r assets _site/
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("_site/app.js")
          source = path.read_text(encoding="utf-8")
          placeholder = "__HF_TOKEN__"
          if source.count(placeholder) != 1:
              raise SystemExit("Expected exactly one HF token placeholder")
          path.write_text(source.replace(placeholder, os.environ["HF_TOKEN"]), encoding="utf-8")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
